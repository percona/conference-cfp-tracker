name: Daily CFP Update

on:
  schedule:
    - cron: '0 4 * * *' # every day 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run pipeline
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          # 1) Refresh the local JSON database (open CFPs)
          python -m scripts.main
          # 2) Create/update Conferences in Jira SPEAK, then close CFPs that dropped out
          python -m scripts.sync_jira --apply
      - name: Commit and push changes if any
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: daily update $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main || true
            git push
          else
            echo "No changes to commit"
          fi
